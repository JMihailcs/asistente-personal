[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asistente-mikha"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-ai>=2.42.0",
    "psutil>=6.0",
    "httpx>=0.27",
    "arize-phoenix>=8.0",
    "arize-phoenix-otel>=0.6",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "chromadb>=0.5",
    "pyyaml>=6.0",
    "jeepney>=0.8",
    "openinference-instrumentation-pydantic-ai>=0.1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
mikha = "asistente_mikha.cli:main"
mikha-eval = "asistente_mikha.evals.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/asistente_mikha"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requiere ollama serve corriendo con el modelo 'default'"]
